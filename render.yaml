services:
  - type: web
    name: agri-funds-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false   # set in the Render dashboard; never committed
      - key: JWT_SECRET
        sync: false   # set in the Render dashboard; never committed
